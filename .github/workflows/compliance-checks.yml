
name: DevSecOps Compliance Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.30

      - name: Scan Terraform infrastructure
        run: |
          checkov -d infra --framework terraform \
            --output cli \
            --soft-fail

  policy-tests:
    name: Compliance Policy Tests
    runs-on: ubuntu-latest
    needs: checkov

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov==3.3.30

      - name: Install PowerShell
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Run policy tests
        shell: pwsh
        run: ./scripts/run-policy-tests.ps1

      - name: Upload compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-test-evidence
          path: |
            evidence/policy-test-summary.csv
            evidence/ENC-001-compliant/results.json
            evidence/ENC-001-noncompliant/results.json
            evidence/ENC-002-compliant/results.json
            evidence/ENC-002-noncompliant/results.json
            evidence/ENC-003-compliant/results.json
            evidence/ENC-003-noncompliant/results.json
            evidence/NET-001-compliant/results.json
            evidence/NET-001-noncompliant/results.json
            evidence/NET-002-compliant/results.json
            evidence/NET-002-noncompliant/results.json
            evidence/NET-003-compliant/results.json
            evidence/NET-003-noncompliant/results.json
            evidence/IAM-001-compliant/results.json
            evidence/IAM-001-noncompliant/results.json
            evidence/IAM-002-compliant/results.json
            evidence/IAM-002-noncompliant/results.json
            evidence/IAM-003-compliant/results.json
            evidence/IAM-003-noncompliant/results.json
          if-no-files-found: warn

      - name: Validate policy test fixtures
        run: |
          python -m pip install pytest
          python -m compileall -q tests
